name: PHP Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} (${{ matrix.dependencies }} dependencies)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ "7.4", "8.3", "8.6" ]
        dependencies: [ "highest" ]
        include:
          # oldest supported combination: lcobucci/jwt 4.3, lcobucci/clock 2, phpseclib 3, guzzle 7, PHPUnit 9.6
          - php: "7.4"
            dependencies: "lowest"
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring, openssl, sodium
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-php${{ matrix.php }}-${{ matrix.dependencies }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-php${{ matrix.php }}-${{ matrix.dependencies }}-

      # composer.lock is not committed (library), dependencies are resolved for the running PHP version
      - name: Install highest dependencies
        if: matrix.dependencies == 'highest'
        run: composer update --prefer-stable --no-progress --no-interaction

      - name: Install lowest dependencies
        if: matrix.dependencies == 'lowest'
        run: composer update --prefer-lowest --prefer-stable --no-progress --no-interaction

      - name: Security audit
        run: composer audit

      - name: PHPStan
        run: composer phpstan

      - name: PHPUnit
        run: composer phpunit
